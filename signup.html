<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — SaaS & Tech Startup</title>
<meta name="description" content="Create your free SaaS Hub account." />
<meta name="author" content="SaaS & Tech Startup" />
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FCFBF8;--bg-2:#F5F3EE;--glass:rgba(255,255,255,.58);
  --text:#1B1B2F;--text-2:#5B6078;
  --purple:#6D28D9;--violet:#8B5CF6;--gold:#D4A017;--peach:#FFB997;--mint:#4ADEC8;--lav:#D8B4FE;
  --grad:linear-gradient(135deg,#6D28D9,#8B5CF6,#D4A017,#FFB997);
  --grad-soft:linear-gradient(135deg,#8B5CF6,#6D28D9);
  --shadow:0 20px 60px rgba(109,40,217,.12);--shadow-lg:0 40px 100px rgba(109,40,217,.18);
  --r:24px;--r-sm:16px;--r-lg:32px;
  --err:#e5484d;--ok:#2da44e;
}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
a{text-decoration:none;color:inherit}ul{list-style:none}
.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:float 18s ease-in-out infinite}
.blob.b1{width:520px;height:520px;background:radial-gradient(circle,#8B5CF6,transparent 70%);top:-120px;left:-100px}
.blob.b2{width:480px;height:480px;background:radial-gradient(circle,#FFB997,transparent 70%);bottom:-120px;right:-120px;animation-delay:-6s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,30px) scale(.95)}}
h1,h2,h3{font-family:'Poppins',sans-serif;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{display:flex;align-items:center}
.logo-mark{display:none}
.site-logo{height:42px;width:auto;object-fit:contain;transition:opacity .3s}
.site-logo:hover{opacity:.85}
.card{width:100%;max-width:460px;background:var(--glass);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.7);border-radius:var(--r-lg);padding:44px 38px;box-shadow:var(--shadow-lg);position:relative}
.card h2{font-size:1.8rem;margin-bottom:6px;text-align:center}
.card .sub{text-align:center;color:var(--text-2);font-size:14px;margin-bottom:28px}
.field{margin-bottom:16px;position:relative}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:8px}
.field input,.field select{width:100%;padding:14px 18px;border-radius:14px;border:1.5px solid rgba(109,40,217,.15);background:#fff;font-family:inherit;font-size:15px;color:var(--text);outline:none;transition:all .3s}
.field input:focus,.field select:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(139,92,246,.12)}
.field input.has-icon{padding-right:48px}
.toggle-eye{position:absolute;right:14px;top:38px;background:none;border:none;color:var(--text-2);cursor:pointer;font-size:16px;padding:4px}
.err-msg{display:none;align-items:center;gap:8px;color:var(--err);font-size:13px;margin-top:6px;animation:shake .4s}
.err-msg.show{display:flex}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.field.invalid input,.field.invalid select{border-color:var(--err)}
.terms{display:flex;align-items:flex-start;gap:10px;margin:8px 0 20px;font-size:13px;color:var(--text-2);cursor:pointer}
.terms input{margin-top:2px;width:16px;height:16px;accent-color:var(--violet)}
.terms a{color:var(--purple);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;font-family:'Plus Jakarta Sans';font-weight:600;font-size:15px;padding:15px 26px;border-radius:100px;border:none;cursor:pointer;transition:all .35s cubic-bezier(.2,.8,.2,1)}
.btn-primary{background:var(--grad);color:#fff;background-size:200% 200%;box-shadow:0 12px 30px rgba(109,40,217,.35)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 20px 44px rgba(109,40,217,.45);background-position:100% 50%}
.divider{display:flex;align-items:center;gap:14px;margin:24px 0;color:var(--text-2);font-size:13px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(109,40,217,.15)}
.social{display:flex;gap:10px}
.social a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;background:#fff;border:1px solid rgba(109,40,217,.12);font-weight:600;font-size:14px;transition:all .3s}
.social a:hover{transform:translateY(-2px);border-color:var(--violet);box-shadow:0 10px 24px rgba(139,92,246,.15)}
.foot{text-align:center;margin-top:20px;font-size:14px;color:var(--text-2)}
.foot a{color:var(--purple);font-weight:600}
.home-link{position:absolute;top:24px;left:24px;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:100px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid rgba(109,40,217,.15);font-weight:600;font-size:14px;color:var(--text);transition:all .3s}
.home-link:hover{transform:translateY(-2px);border-color:var(--violet);color:var(--purple)}
@media(max-width:480px){.card{padding:34px 24px}.home-link{top:16px;left:16px}}
</style>
</head>
<body>
<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div></div>

<a href="index.html" class="home-link"><i class="fa-solid fa-arrow-left"></i> Home</a>

<div class="card">
  <div style="text-align:center">
    <a href="index.html" class="logo"><img src="/stackly-logo-violet.webp" alt="Stackly" class="site-logo" /></a>
  </div>
  <h2>Create your account</h2>
  <p class="sub">Start your 14-day free trial — no credit card required</p>

  <form id="signupForm" novalidate>
    <div class="field" id="f-role">
      <label for="role">Role</label>
      <select id="role" name="role">
        <option value="">Select your role</option>
        <option value="admin">Admin</option>
        <option value="client">Client</option>
      </select>
      <div class="err-msg"><i class="fa-solid fa-circle-exclamation"></i> <span></span></div>
    </div>
    <div class="field" id="f-name">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" placeholder="Jane Doe" />
      <div class="err-msg"><i class="fa-solid fa-circle-exclamation"></i> <span></span></div>
    </div>
    <div class="field" id="f-email">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" />
      <div class="err-msg"><i class="fa-solid fa-circle-exclamation"></i> <span></span></div>
    </div>
    <div class="field" id="f-password">
      <label for="password">Password</label>
      <input type="password" id="password" class="has-icon" placeholder="Minimum 6 characters" />
      <button type="button" class="toggle-eye" onclick="togglePw('password',this)" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
      <div class="err-msg"><i class="fa-solid fa-circle-exclamation"></i> <span></span></div>
    </div>
    <div class="field" id="f-confirm">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" class="has-icon" placeholder="Re-enter password" />
      <button type="button" class="toggle-eye" onclick="togglePw('confirm',this)" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
      <div class="err-msg"><i class="fa-solid fa-circle-exclamation"></i> <span></span></div>
    </div>
    <label class="terms"><input type="checkbox" id="agree" /> I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a></label>
    <button type="submit" class="btn btn-primary">Create account <i class="fa-solid fa-arrow-right"></i></button>
  </form>

  <div class="divider">or sign up with</div>
  <div class="social">
    <a href="#"><i class="fa-brands fa-google"></i> Google</a>
    <a href="#"><i class="fa-brands fa-github"></i> GitHub</a>
  </div>

  <p class="foot">Already have an account? <a href="login.html">Sign in</a></p>
</div>

<script>
function togglePw(id,btn){const el=document.getElementById(id);const ic=btn.querySelector('i');if(el.type==='password'){el.type='text';ic.className='fa-solid fa-eye-slash'}else{el.type='password';ic.className='fa-solid fa-eye'}}
function setError(fid,msg){const f=document.getElementById(fid);f.classList.add('invalid');const em=f.querySelector('.err-msg');em.querySelector('span').textContent=msg;em.classList.add('show')}
function clearError(fid){const f=document.getElementById(fid);f.classList.remove('invalid');f.querySelector('.err-msg').classList.remove('show')}
document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>clearError(el.closest('.field').id)));

document.getElementById('signupForm').addEventListener('submit',function(e){
  e.preventDefault();
  let ok=true;
  const role=document.getElementById('role').value;
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirm').value;
  const agree=document.getElementById('agree').checked;

  if(!role){setError('f-role','Please select a role.');ok=false}else clearError('f-role');
  if(!name){setError('f-name','Please enter your full name.');ok=false}
  else if(!/^[A-Za-z\s]+$/.test(name)){setError('f-name','Only alphabets are allowed in your name.');ok=false}
  else clearError('f-name');
  if(!email){setError('f-email','Please enter your email.');ok=false}
  else if(!/^[^\s@]+@[^\s@]+\.(com|in|org)$/i.test(email)){setError('f-email','Email must end with .com, .in, or .org');ok=false}
  else clearError('f-email');
  if(!password){setError('f-password','Please enter a password.');ok=false}
  else if(password.length<6){setError('f-password','Password must be at least 6 characters.');ok=false}
  else clearError('f-password');
  if(!confirm){setError('f-confirm','Please confirm your password.');ok=false}
  else if(confirm!==password){setError('f-confirm','Passwords do not match.');ok=false}
  else clearError('f-confirm');
  if(!agree){alert('Please accept the Terms & Conditions to continue.');ok=false}

  if(!ok)return;
  alert('Account created successfully! Redirecting to login...');
  location.href='login.html';
});
</script>
</body>
</html>
