<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Page not found | stackly</title>
<meta name="description" content="The page you were looking for has moved or no longer exists. Head back to the stackly homepage.">
<meta property="og:title" content="404 · Page not found | stackly">
<meta property="og:description" content="The page you were looking for has moved or no longer exists. Head back to the stackly homepage.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
--bg:#07040F;--bg2:#0F0A1F;--glass:rgba(18,18,30,.55);--line:rgba(255,255,255,.08);
--acc:#9B5CFF;--acc2:#FF5EA8;--hi:#3CF2FF;--gold:#F8C14A;
--head:#FFFFFF;--para:#B9BED3;--muted:#8C91A7;
--grad:linear-gradient(135deg,#9B5CFF,#FF5EA8,#3CF2FF);
--shadow:0 30px 80px -30px rgba(155,92,255,.55);
--r:22px;
}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--para);font-family:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{color:var(--head);font-family:"Sora","Space Grotesk",sans-serif;line-height:1.1;letter-spacing:-.03em;margin:0 0 .5em}
h1{font-size:clamp(2.4rem,6vw,4.6rem);font-weight:700}
h2{font-size:clamp(1.9rem,4vw,3rem);font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0 0 1rem}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{width:min(1200px,92vw);margin:0 auto}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* aurora */
.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
 radial-gradient(1200px 700px at 15% -10%,rgba(155,92,255,.28),transparent 60%),
 radial-gradient(900px 600px at 90% 0%,rgba(255,94,168,.20),transparent 60%),
 radial-gradient(1000px 800px at 60% 110%,rgba(60,242,255,.16),transparent 60%),var(--bg)}
.aurora::after{content:"";position:absolute;inset:-20%;background:conic-gradient(from 0deg,rgba(155,92,255,.10),rgba(255,94,168,.10),rgba(60,242,255,.10),rgba(155,92,255,.10));filter:blur(90px);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.42;z-index:-1;pointer-events:none;animation:float 16s ease-in-out infinite}
.blob.b1{width:340px;height:340px;background:#9B5CFF;top:8%;left:-90px}
.blob.b2{width:300px;height:300px;background:#FF5EA8;top:52%;right:-80px;animation-delay:-5s}
.blob.b3{width:260px;height:260px;background:#3CF2FF;bottom:-60px;left:40%;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-46px,0) scale(1.08)}}
#mouseGlow{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(155,92,255,.16),transparent 62%);transform:translate(-50%,-50%);transition:opacity .4s;mix-blend-mode:screen}
/* grid noise */
.grid-lines{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:70px 70px;mask-image:radial-gradient(circle at 50% 20%,#000,transparent 78%)}
/* header */
header.site{position:sticky;top:0;z-index:60;transition:.35s}
header.site .bar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 22px;margin-top:16px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);border-radius:20px;box-shadow:0 20px 50px -35px rgba(0,0,0,.9)}
header.site.scrolled .bar{background:rgba(10,7,20,.82);box-shadow:0 24px 60px -30px rgba(155,92,255,.45)}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(155,92,255,.12);border:1px solid var(--line);box-shadow:0 0 26px rgba(155,92,255,.35)}
.logo-text{font-family:"Sora",sans-serif;font-weight:700;color:#fff;font-size:1.1rem;letter-spacing:-.02em}
.logo-text em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav.main{display:flex;gap:26px;align-items:center}
nav.main a{position:relative;font-size:.94rem;color:var(--para);padding:4px 0;transition:.25s}
nav.main a::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:100%;background:var(--grad);transform:scaleX(0);transform-origin:right;transition:transform .35s}
nav.main a:hover{color:#fff}
nav.main a:hover::after,nav.main a.active::after{transform:scaleX(1);transform-origin:left}
nav.main a.active{color:#fff}
.head-cta{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:14px;font-weight:600;font-size:.92rem;border:1px solid var(--line);cursor:pointer;transition:transform .3s,box-shadow .3s,background .3s;font-family:inherit;background:transparent;color:var(--head)}
.btn:hover{transform:translateY(-3px)}
.btn-primary{background:var(--grad);color:#0A0614;border:none;box-shadow:0 14px 40px -12px rgba(155,92,255,.75)}
.btn-primary:hover{box-shadow:0 22px 55px -12px rgba(255,94,168,.75)}
.btn-ghost{background:rgba(255,255,255,.04)}
.btn-ghost:hover{background:rgba(255,255,255,.09);box-shadow:0 0 0 1px rgba(60,242,255,.35),0 16px 40px -22px rgba(60,242,255,.6)}
.burger{display:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;place-items:center}
.burger span{display:block;width:20px;height:2px;background:#fff;position:relative}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:20px;height:2px;background:#fff;transition:.3s}
.burger span::before{top:-6px}.burger span::after{top:6px}
.mobile-menu{position:fixed;inset:0;z-index:80;display:none}
.mobile-menu.open{display:block}
.mobile-menu .scrim{position:absolute;inset:0;background:rgba(4,2,10,.72);backdrop-filter:blur(8px)}
.mobile-panel{position:absolute;top:0;right:0;height:100%;width:min(340px,88vw);background:linear-gradient(160deg,#0F0A1F,#07040F);border-left:1px solid var(--line);padding:24px;transform:translateX(100%);transition:transform .4s cubic-bezier(.6,.02,.2,1);display:flex;flex-direction:column;gap:8px}
.mobile-menu.open .mobile-panel{transform:translateX(0)}
.mobile-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.close-x{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;font-size:1.3rem;cursor:pointer}
.mobile-panel a.mlink{padding:14px 16px;border-radius:14px;border:1px solid transparent;color:var(--para);transition:.25s}
.mobile-panel a.mlink:hover,.mobile-panel a.mlink.active{color:#fff;border-color:var(--line);background:rgba(155,92,255,.12)}
/* sections */
section{padding:96px 0;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:.76rem;letter-spacing:.22em;text-transform:uppercase;color:var(--hi);border:1px solid var(--line);background:rgba(60,242,255,.06);padding:7px 16px;border-radius:999px;margin-bottom:20px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--hi);box-shadow:0 0 12px var(--hi)}
.sec-head{max-width:680px;margin-bottom:52px}
.sec-head.center{margin:0 auto 56px;text-align:center}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(16px);position:relative;overflow:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,border-color .45s}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .45s;pointer-events:none}
.glass:hover{transform:translateY(-8px);box-shadow:var(--shadow);border-color:transparent}
.glass:hover::before{opacity:1}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{padding:28px}
.icon-badge{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.4rem;background:rgba(155,92,255,.14);border:1px solid var(--line);margin-bottom:18px;transition:.4s}
.glass:hover .icon-badge{transform:translateY(-4px) rotate(-6deg);box-shadow:0 0 30px rgba(155,92,255,.5)}
.thumb{overflow:hidden;border-radius:16px;margin-bottom:18px;aspect-ratio:16/10}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.8,.2,1);filter:saturate(1.1) contrast(1.05)}
.glass:hover .thumb img{transform:scale(1.1)}
.muted{color:var(--muted);font-size:.9rem}
.reveal{opacity:0;transform:translateY(34px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}
/* footer */
footer.site{border-top:1px solid var(--line);margin-top:40px;padding:70px 0 30px;background:linear-gradient(180deg,transparent,rgba(15,10,31,.85))}
.f-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.4fr;gap:36px}
footer h4{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
footer ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
footer ul a{font-size:.93rem;transition:.25s;display:inline-block}
footer ul a:hover{color:#fff;transform:translateX(5px);text-shadow:0 0 18px rgba(155,92,255,.9)}
.news{display:flex;gap:8px;margin-top:14px}
.news input{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:13px;padding:12px 14px;color:#fff;font-family:inherit;outline:none}
.news input:focus{border-color:rgba(60,242,255,.5);box-shadow:0 0 0 4px rgba(60,242,255,.10)}
.socials{display:flex;gap:10px;margin-top:20px}
.socials a{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);display:grid;place-items:center;background:rgba(255,255,255,.03);transition:.3s}
.socials a:hover{transform:translateY(-5px);border-color:transparent;background:var(--grad);box-shadow:0 14px 34px -12px rgba(255,94,168,.8)}
.socials svg{width:18px;height:18px;fill:#fff}
.f-bottom{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:44px;padding-top:22px;font-size:.85rem;color:var(--muted)}
/* misc */
.stat-num{font-family:"Sora",sans-serif;font-size:2.3rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-block;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:.82rem;margin:0 8px 8px 0}
.field{margin-bottom:16px}
.field label{display:block;font-size:.84rem;color:var(--muted);margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:#fff;font-family:inherit;font-size:.95rem;outline:none;transition:.3s}
.field input:focus,.field textarea:focus{border-color:rgba(155,92,255,.6);box-shadow:0 0 0 4px rgba(155,92,255,.12)}
.err{display:none;color:#FF7BA8;font-size:.8rem;margin-top:6px}
.err.show{display:block;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ok-msg{display:none;margin-top:14px;padding:14px;border-radius:14px;border:1px solid rgba(60,242,255,.35);background:rgba(60,242,255,.08);color:#CFFBFF}
.ok-msg.show{display:block}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.f-grid{grid-template-columns:1fr 1fr}}
@media(max-width:820px){nav.main,.head-cta{display:none}.burger{display:grid}section{padding:70px 0}.g2,.g3,.g4{grid-template-columns:1fr}.f-grid{grid-template-columns:1fr}}
.e404{min-height:100vh;display:grid;place-items:center;padding:40px 20px}.big{font-family:'Sora';font-size:clamp(6rem,22vw,14rem);font-weight:800;line-height:.9;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 20px 60px rgba(155,92,255,.6));animation:float 8s ease-in-out infinite}</style>
</head>
<body>
<div class="aurora"></div><div class="grid-lines"></div>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>


<div class="e404"><div class="glass reveal in" style="padding:56px;text-align:center;max-width:640px;border-radius:32px">
<span class="eyebrow"><span class="dot"></span>Error 404</span>
<div class="big">404</div>
<h2>This route drifted out of orbit</h2>
<p>The page you're after was moved, renamed, or never existed. Our agents are already looking.</p>
<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px">
<a class="btn btn-primary" href="admin.html">Go to Dashboard</a>
<button class="btn btn-ghost" onclick="history.back()">Go back</button></div>
</div></div>

<script>
(function(){
 var g=document.createElement('div');g.id='mouseGlow';document.body.appendChild(g);
 window.addEventListener('pointermove',function(e){g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';},{passive:true});
 var h=document.getElementById('siteHeader');
 if(h){window.addEventListener('scroll',function(){h.classList.toggle('scrolled',window.scrollY>20)},{passive:true});}
 var b=document.getElementById('burger'),m=document.getElementById('mobileMenu');
 if(b&&m){b.addEventListener('click',function(){m.classList.add('open');document.body.style.overflow='hidden'});
  m.querySelectorAll('[data-close]').forEach(function(el){el.addEventListener('click',function(){m.classList.remove('open');document.body.style.overflow=''})});
  m.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){m.classList.remove('open');document.body.style.overflow=''})});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){m.classList.remove('open');document.body.style.overflow=''}});}
 var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.12});
 document.querySelectorAll('.reveal').forEach(function(el,i){el.style.transitionDelay=(i%4*70)+'ms';io.observe(el)});
 var co=new IntersectionObserver(function(en){en.forEach(function(x){ if(!x.isIntersecting)return; co.unobserve(x.target);
   var el=x.target,to=parseFloat(el.dataset.count),suf=el.dataset.suffix||'',dec=(to%1!==0)?1:0,st=performance.now(),dur=1600;
   function step(t){var p=Math.min((t-st)/dur,1);p=1-Math.pow(1-p,3);el.textContent=(to*p).toFixed(dec)+suf;if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step);})},{threshold:.5});
 document.querySelectorAll('[data-count]').forEach(function(el){co.observe(el)});
})();
</script>
</body></html>
